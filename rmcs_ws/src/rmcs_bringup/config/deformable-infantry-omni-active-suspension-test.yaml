rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::DeformableInfantryOmni -> deformable_infantry

      - rmcs_core::referee::Status -> referee_status
      - rmcs_core::referee::Command -> referee_command

      - rmcs_core::referee::command::Interaction -> referee_interaction
      - rmcs_core::referee::command::interaction::Ui -> referee_ui
      - rmcs_core::referee::app::ui::Infantry -> referee_ui_infantry

      - rmcs_core::controller::gimbal::DeformableInfantryGimbalController -> gimbal_controller

      - rmcs_core::controller::shooting::FrictionWheelController -> friction_wheel_controller
      - rmcs_core::controller::shooting::HeatController -> heat_controller
      - rmcs_core::controller::shooting::BulletFeederController17mm -> bullet_feeder_controller
      - rmcs_core::controller::pid::PidController -> left_friction_velocity_pid_controller
      - rmcs_core::controller::pid::PidController -> right_friction_velocity_pid_controller
      - rmcs_core::controller::pid::PidController -> bullet_feeder_velocity_pid_controller

      - rmcs_core::controller::active_suspension::AdaptiveOmniDeformableChassis -> adaptive_chassis_controller
      - rmcs_core::controller::active_suspension::AdaptiveOmniContactEstimator -> adaptive_contact_estimator
      - rmcs_core::controller::active_suspension::AdaptiveOmniActiveSuspension -> adaptive_active_suspension
      - rmcs_core::controller::chassis::ChassisPowerController -> chassis_power_controller
      - rmcs_core::controller::active_suspension::AdaptiveDeformableOmniWheelController -> adaptive_deformable_chassis_controller

      - rmcs_core::controller::adrc::AdrcController -> lf_joint_adrc_controller
      - rmcs_core::controller::adrc::AdrcController -> lb_joint_adrc_controller
      - rmcs_core::controller::adrc::AdrcController -> rb_joint_adrc_controller
      - rmcs_core::controller::adrc::AdrcController -> rf_joint_adrc_controller

      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

value_broadcaster:
  ros__parameters:
    forward_list:
      - /chassis/imu/pitch
      - /chassis/imu/roll
      - /chassis/left_front_joint/control_torque
      - /chassis/left_back_joint/control_torque
      - /chassis/right_front_joint/control_torque
      - /chassis/right_back_joint/control_torque
      - /chassis/left_front_contact/confidence
      - /chassis/left_back_contact/confidence
      - /chassis/right_back_contact/confidence
      - /chassis/right_front_contact/confidence
      - /chassis/left_front_contact/load_share
      - /chassis/left_back_contact/load_share
      - /chassis/right_back_contact/load_share
      - /chassis/right_front_contact/load_share
      - /chassis/contact/confidence_mean
      - /chassis/body/heave_reference
      - /chassis/body/heave_estimate
      - /chassis/body/pitch_reference
      - /chassis/body/pitch_estimate
      - /chassis/body/roll_reference
      - /chassis/body/roll_estimate
      - /chassis/body/warp_reference
      - /chassis/body/warp_estimate

deformable_infantry:
  ros__parameters:
    serial_filter_rmcs_board: "AF-3CE0-2D2A-6CDC-89D0-CA40-90D7-46B5-4970"
    serial_filter_top_board: "D4-0262-9E84-E715-CADB-9894-7241"
    left_front_zero_point: 374
    left_back_zero_point: 5801
    right_back_zero_point: 7817
    right_front_zero_point: 7136
    yaw_motor_zero_point: 56216
    pitch_motor_zero_point: 10898

