rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::DeformableInfantryV2 -> deformable_infantry

      - rmcs_core::referee::Status -> referee_status
      - rmcs_core::referee::Command -> referee_command

      - rmcs_core::referee::command::Interaction -> referee_interaction
      - rmcs_core::referee::command::interaction::Ui -> referee_ui
      - rmcs_core::referee::app::ui::Infantry -> referee_ui_infantry

      - rmcs_core::controller::gimbal::DeformableInfantryGimbalController -> gimbal_controller

      - rmcs_core::controller::shooting::FrictionWheelController -> friction_wheel_controller
      - rmcs_core::controller::shooting::HeatController -> heat_controller
      - rmcs_core::controller::shooting::BulletFeederController17mm -> bullet_feeder_controller
      - rmcs_core::controller::pid::PidController -> left_friction_velocity_pid_controller
      - rmcs_core::controller::pid::PidController -> right_friction_velocity_pid_controller
      - rmcs_core::controller::pid::PidController -> bullet_feeder_velocity_pid_controller

      - rmcs_core::controller::chassis::DeformableChassis -> chassis_controller
      - rmcs_core::controller::chassis::ChassisPowerController -> chassis_power_controller
      - rmcs_core::controller::chassis::WheelDemoController -> deformable_chassis_controller

      - rmcs_core::controller::adrc::AdrcController -> lf_joint_controller
      - rmcs_core::controller::adrc::AdrcController -> lb_joint_controller
      - rmcs_core::controller::adrc::AdrcController -> rb_joint_controller
      - rmcs_core::controller::adrc::AdrcController -> rf_joint_controller
      - rmcs_core::chassis::suspension::GroundContactConfidenceEstimator -> lf_ground_contact_confidence
      - rmcs_core::chassis::suspension::GroundContactConfidenceEstimator -> lb_ground_contact_confidence
      - rmcs_core::chassis::suspension::GroundContactConfidenceEstimator -> rb_ground_contact_confidence
      - rmcs_core::chassis::suspension::GroundContactConfidenceEstimator -> rf_ground_contact_confidence

      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

value_broadcaster:
  ros__parameters:
    forward_list:
      - /gimbal/yaw/angle
      - /gimbal/yaw/target_angle
      - /gimbal/pitch/angle
      - /gimbal/pitch/target_angle
      - /gimbal/pitch/pid_feedback_torque
      - /gimbal/pitch/gravity_feedforward_torque
      - /chassis/left_front_joint/eso_z3
      - /chassis/left_front_joint/ground_contact_confidence
      - /chassis/left_front_joint/ground_contact_z3_score
      - /chassis/left_front_joint/ground_contact_block_score
      - /chassis/left_front_joint/ground_contact_tracking_score
      - /chassis/left_front_joint/ground_contact_torque_score
      - /chassis/left_back_joint/eso_z3
      - /chassis/left_back_joint/ground_contact_confidence
      - /chassis/left_back_joint/ground_contact_z3_score
      - /chassis/left_back_joint/ground_contact_block_score
      - /chassis/left_back_joint/ground_contact_tracking_score
      - /chassis/left_back_joint/ground_contact_torque_score
      - /chassis/right_back_joint/eso_z3
      - /chassis/right_back_joint/ground_contact_confidence
      - /chassis/right_back_joint/ground_contact_z3_score
      - /chassis/right_back_joint/ground_contact_block_score
      - /chassis/right_back_joint/ground_contact_tracking_score
      - /chassis/right_back_joint/ground_contact_torque_score
      - /chassis/right_front_joint/eso_z3
      - /chassis/right_front_joint/ground_contact_confidence
      - /chassis/right_front_joint/ground_contact_z3_score
      - /chassis/right_front_joint/ground_contact_block_score
      - /chassis/right_front_joint/ground_contact_tracking_score
      - /chassis/right_front_joint/ground_contact_torque_score

deformable_infantry:
  ros__parameters:
    serial_filter_rmcs_board: "AF-23FB-EE32-B892-1302-AE70-D640-7B4E-0CBF"
    serial_filter_top_board: "AF-ABAC-786D-1B53-99F6-00A2-42A6-AA95-9D69"
    left_front_zero_point: 7173
    left_back_zero_point: 5167
    right_back_zero_point: 3098
    right_front_zero_point: 6485
    yaw_motor_zero_point: 39442
    pitch_motor_zero_point: 56556
    debug_log_supercap: false
    debug_log_wheel_motor: false
    debug_log_deformable_joint_motor: false

chassis_controller:
  ros__parameters:
    # Deploy geometry / chassis-owned joint intent
    min_angle: 20.0
    max_angle: 50.0
    spin_ratio: 0.3
    target_physical_velocity_limit: 80.0
    target_physical_acceleration_limit: 360.0

gimbal_controller:
  ros__parameters:
    inertia: 0.5  # kg·m²
    friction: 0.0  # Nm/(rad/s)

    upper_limit: -0.60 # -35 deg
    lower_limit: 0.06 # 6 deg
    use_encoder_pitch: true

    yaw_angle_kp: 15.0
    yaw_angle_ki: 0.0
    yaw_angle_kd: 0.0

    yaw_velocity_kp: 5.0
    yaw_velocity_ki: 0.0
    yaw_velocity_kd: 0.0

    pitch_angle_kp: 15.0
    pitch_angle_ki: 0.0
    pitch_angle_kd: 0.0

    pitch_velocity_kp: 2.0
    pitch_velocity_ki: 0.05
    pitch_velocity_kd: 0.0

    pitch_torque_control: true
    pitch_gravity_ff_gain: 7.0
    pitch_gravity_ff_phase: 0.3

friction_wheel_controller:
  ros__parameters:
    friction_wheels:
      - /gimbal/left_friction
      - /gimbal/right_friction
    friction_velocities:
      - 600.0
      - 600.0
    friction_soft_start_stop_time: 1.0

heat_controller:
  ros__parameters:
    heat_per_shot: 10000
    reserved_heat: 0

bullet_feeder_controller:
  ros__parameters:
    bullets_per_feeder_turn: 8.0
    shot_frequency: 30.0
    safe_shot_frequency: 10.0
    eject_frequency: 10.0
    eject_time: 0.05
    deep_eject_frequency: 5.0
    deep_eject_time: 0.2
    single_shot_max_stop_delay: 2.0

left_friction_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/left_friction/velocity
    setpoint: /gimbal/left_friction/control_velocity
    control: /gimbal/left_friction/control_torque
    kp: 0.003436926
    ki: 0.00
    kd: 0.009373434

right_friction_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/right_friction/velocity
    setpoint: /gimbal/right_friction/control_velocity
    control: /gimbal/right_friction/control_torque
    kp: 0.003436926
    ki: 0.00
    kd: 0.009373434

bullet_feeder_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/bullet_feeder/velocity
    setpoint: /gimbal/bullet_feeder/control_velocity
    control: /gimbal/bullet_feeder/control_torque
    kp: 1.4
    ki: 0.0
    kd: 0.0

deformable_chassis_controller:
  ros__parameters:
    mass: 23.0
    moment_of_inertia: 1.0
    chassis_radius: 0.2341741
    rod_length: 0.150
    wheel_radius: 0.055
    friction_coefficient: 0.6
    k1: 2.958580e+00
    k2: 3.082190e-03
    no_load_power: 11.37

lf_joint_controller:
  ros__parameters:
    measurement: /chassis/left_front_joint/physical_angle
    setpoint: /chassis/left_front_joint/target_physical_angle
    eso_z3_output: /chassis/left_front_joint/eso_z3
    control: /chassis/left_front_joint/control_torque
    dt: 0.001
    b0: -1.0
    kt: 1.0
    td_h: 0.001
    td_r: 50.0
    eso_w0: 250.0
    eso_auto_beta: true
    k1: 30.0
    k2: 17.0
    alpha1: 0.75
    alpha2: 0.7
    delta: 0.02
    u_min: -200.0
    u_max: 200.0
    output_min: -200.0
    output_max: 200.0

